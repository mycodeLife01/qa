root = "."
tmp_dir = "tmp"

[build]
  # 指定入口文件
  cmd = "go build -o ./tmp/main ./cmd/main.go"
  bin = "./tmp/main"
  # 监听的文件扩展名
  include_ext = ["go", "yaml", "toml"]
  # 排除的目录
  exclude_dir = ["tmp", "vendor", ".git"]
  # 延迟时间（毫秒）
  delay = 1000

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
